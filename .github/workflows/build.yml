
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Descomprimir proyecto Android
        run: |
          unzip -o OnAirPlay_Proyecto_Reconstruido.zip -d .
          test -f OnAirPlay/app/build.gradle.kts
          test -f OnAirPlay/settings.gradle.kts

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

            - name: Configurar Android SDK
        uses: android-actions/setup-android@v4
        with:
          accept-android-sdk-licenses: true
          packages: platform-tools


      - name: Instalar SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar OnAirPlay
        env:
          API_CHECK_URL: ${{ vars.API_CHECK_URL }}
          API_NOTIFY_URL: ${{ vars.API_NOTIFY_URL }}
        run: |
          CHECK_URL="${API_CHECK_URL:-https://script.google.com/macros/s/AKfycbzyOLJ6F1kytvtVvTuvL3GjLwWPidcKIfUIqf8myioeg2_XMc15IOwVKyCZ7ryu_NK9_A/exec}"
          NOTIFY_URL="${API_NOTIFY_URL:-https://script.google.com/macros/s/AKfycbzyOLJ6F1kytvtVvTuvL3GjLwWPidcKIfUIqf8myioeg2_XMc15IOwVKyCZ7ryu_NK9_A/exec}"
          gradle -p OnAirPlay assembleDebug \
            -PAPI_CHECK_URL="$CHECK_URL" \
            -PAPI_NOTIFY_URL="$NOTIFY_URL"
          cp OnAirPlay/app/build/outputs/apk/debug/app-debug.apk OnAirPlay/app/build/outputs/apk/debug/OnAirPlay.apk

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: OnAirPlay-apk
          path: OnAirPlay/app/build/outputs/apk/debug/OnAirPlay.apk
          if-no-files-found: error
